spring:
  application:
    name: 'order-service'

  profiles:
    active: "${APPLICATION_PROFILE}"

  datasource:
    url: "${DB_URL}"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: 20

  data:
    web:
      pageable:
        default-page-size: 5
        max-page-size: 50
        one-indexed-parameters: 'true'

  jpa:
    hibernate:
      ddl-auto: 'validate'
    show-sql: 'true'
    properties:
      hibernate:
        default_schema: 'app'

  liquibase:
    enabled: 'true'
    change-log: 'classpath:/db/changelog/db.changelog-master.yml'
    default-schema: 'app'

logging:
  level:
    root: 'info'

# Custom properties
application:
  security:
    enabled: 'false'
    secretKey: "${TOKEN_SECRET}"
  feign:
    clients:
      user-service:
        url: 'http://localhost:8080'
